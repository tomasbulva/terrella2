name: v2
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e './catalog[dev]' -e './asset-pipeline[dev]' -r world-context/reference/requirements-dev.txt
      - name: catalog
        working-directory: catalog
        run: python -m pytest -q
      - name: puzzles
        working-directory: puzzles
        run: python -m unittest discover -s tests -t .
      - name: world-context
        working-directory: world-context/reference
        run: python -m pytest -q
      - name: asset-pipeline (incl. contract tests against catalog and puzzles)
        working-directory: asset-pipeline
        run: python -m pytest -q
