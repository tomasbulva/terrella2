# Versioned price table, same keys as the catalog's price table:
# (provider, model, unit) -> usd per unit, matched EXACTLY (no globs), like
# the catalog does. `python -m terrella_assets sync-prices` pushes missing or
# changed rows to the catalog (admin token). Ledger rows record the version
# they were priced at; bump `version` when you change a number.
# A usage with no matching row is an error (here and in the catalog: 422).

[meta]
version = "2026-10-15.2"

# Local compute. Not reported to the catalog (free), kept for local totals.
[[price]]
provider = "local"
model = "procedural"
unit = "cpu_second"
usd = 0.0

[[price]]
provider = "local"
model = "blender"
unit = "cpu_second"
usd = 0.0

